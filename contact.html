    <section class="contact-layout block">
      <div>
        <p class="text-body mb-xl" style="font-size: clamp(1.25rem, 2vw, 1.5rem); font-weight: 300;">Terbuka untuk peluang baru, diskusi arsitektur, dan ngopi santai (virtual atau langsung di Jakarta).</p>

            <input type="email" id="email" name="email" class="input" placeholder="john@perusahaan.com" required>

          <div>

            <textarea id="message" name="message" class="input" placeholder="Jelaskan secara singkat apa yang ingin Anda diskusikan..." required></textarea>
          </div>

          <div style="text-align: right; margin-top: var(--space-md);">
            <button type="submit" class="btn-primary">
              Kirim Pesan <i data-lucide="arrow-right" style="width: 16px; height: 16px; margin-left: 8px;"></i>
